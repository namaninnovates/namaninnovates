<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="100%" height="100%">
  <defs>
    <style>
      .code-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
    </style>
  </defs>

  <rect width="1000" height="175" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Card 1: Stats -->
  <g class="code-mono">
    <rect x="15" y="15" width="310" height="145" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="42" fill="#f0f6fc" font-size="12" font-weight="700">GITHUB STATS</text>
    <line x1="30" y1="52" x2="310" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <text x="30" y="80" fill="#8b949e" font-size="10.5">Total Commits:</text>
    <text x="305" y="80" fill="#f0f6fc" font-size="11.5" font-weight="700" text-anchor="end">760</text>
    
    <text x="30" y="108" fill="#8b949e" font-size="10.5">Repositories:</text>
    <text x="305" y="108" fill="#f0f6fc" font-size="11.5" font-weight="700" text-anchor="end">33</text>
    
    <text x="30" y="136" fill="#8b949e" font-size="10.5">Global Client Hubs:</text>
    <text x="305" y="136" fill="#f0f6fc" font-size="11.5" font-weight="700" text-anchor="end">15</text>
  </g>

  <!-- Card 2: Languages -->
  <g class="code-mono">
    <rect x="340" y="15" width="320" height="145" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="355" y="42" fill="#f0f6fc" font-size="12" font-weight="700">MOST USED LANGUAGES</text>
    <line x1="355" y1="52" x2="645" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <rect x="355" y="66" width="290" height="7" rx="3.5" fill="#21262d"/>
    <rect x="355" y="66" width="256.9" height="7" rx="2" fill="#f0f6fc"/>
    <rect x="611.9" y="66" width="21.7" height="7" rx="2" fill="#c9d1d9"/>
    <rect x="633.6" y="66" width="5.0" height="7" rx="2" fill="#8b949e"/>
    <rect x="638.6" y="66" width="4.3" height="7" rx="2" fill="#6e7681"/>
    <rect x="642.9" y="66" width="2.2" height="7" rx="2" fill="#30363d"/>

    <circle cx="360" cy="90" r="3" fill="#f0f6fc"/>
    <text x="369" y="94" fill="#8b949e" font-size="9.5">Python</text>
    <text x="475" y="94" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">88.6%</text>
    <circle cx="360" cy="113" r="3" fill="#c9d1d9"/>
    <text x="369" y="117" fill="#8b949e" font-size="9.5">JavaScript</text>
    <text x="475" y="117" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">7.5%</text>
    <circle cx="360" cy="136" r="3" fill="#8b949e"/>
    <text x="369" y="140" fill="#8b949e" font-size="9.5">HTML</text>
    <text x="475" y="140" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">1.7%</text>
    <circle cx="510" cy="90" r="3" fill="#6e7681"/>
    <text x="519" y="94" fill="#8b949e" font-size="9.5">TypeScript</text>
    <text x="625" y="94" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">1.5%</text>
    <circle cx="510" cy="113" r="3" fill="#30363d"/>
    <text x="519" y="117" fill="#8b949e" font-size="9.5">C / Other</text>
    <text x="625" y="117" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">0.8%</text>
  </g>

  <!-- Card 3: Streak -->
  <g class="code-mono">
    <rect x="675" y="15" width="310" height="145" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="690" y="42" fill="#f0f6fc" font-size="12" font-weight="700">CONTRIBUTION STREAK</text>
    <line x1="690" y1="52" x2="970" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <text x="695" y="80" fill="#8b949e" font-size="10.5">Current Streak:</text>
    <text x="965" y="80" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="end">13 Days</text>
    
    <text x="695" y="108" fill="#8b949e" font-size="10.5">Longest Streak:</text>
    <text x="965" y="108" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="end">16 Days</text>
    
    <text x="695" y="136" fill="#8b949e" font-size="10.5">Total Activity:</text>
    <text x="965" y="136" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="end">760 Events</text>
  </g>
</svg>
