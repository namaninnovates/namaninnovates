<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <style>
      .code-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      @keyframes pulseFlame {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes progressGrow {
        0% { width: 0; }
        100% { width: 100%; }
      }
      .flame-icon {
        transform-origin: 840px 105px;
        animation: pulseFlame 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 100% Transparent Outer Frame -->
  <rect width="1000" height="220" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Card 1: Core Telemetry Stats -->
  <g class="code-mono">
    <rect x="15" y="15" width="310" height="190" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <text x="30" y="42" fill="#f0f6fc" font-size="12" font-weight="700" letter-spacing="0.5">// TELEMETRY STATS</text>
    <line x1="30" y1="52" x2="310" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <text x="30" y="78" fill="#8b949e" font-size="10">TOTAL COMMITS (YTD):</text>
    <text x="280" y="78" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="end">580</text>
    
    <text x="30" y="106" fill="#8b949e" font-size="10">STARS EARNED:</text>
    <text x="280" y="106" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="end">1</text>
    
    <text x="30" y="134" fill="#8b949e" font-size="10">ACTIVE REPOSITORIES:</text>
    <text x="280" y="134" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="end">12</text>
    
    <text x="30" y="162" fill="#8b949e" font-size="10">GLOBAL CLIENT HUBS:</text>
    <text x="280" y="162" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="end">12</text>
    
    <text x="30" y="190" fill="#8b949e" font-size="8.5">// AUTH: NAMANINNOVATES</text>
  </g>

  <!-- Card 2: Monochrome Language Distribution -->
  <g class="code-mono">
    <rect x="340" y="15" width="320" height="190" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <text x="355" y="42" fill="#f0f6fc" font-size="12" font-weight="700" letter-spacing="0.5">// LANGUAGE MATRIX</text>
    <line x1="355" y1="52" x2="645" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <!-- Multi-Segment Monochrome Progress Bar -->
    <rect x="355" y="66" width="290" height="8" rx="4" fill="#21262d"/>
    <rect x="355" y="66" width="256.9" height="8" rx="2" fill="#f0f6fc"/>
    <rect x="611.9" y="66" width="21.7" height="8" rx="2" fill="#c9d1d9"/>
    <rect x="633.6" y="66" width="5.0" height="8" rx="2" fill="#8b949e"/>
    <rect x="638.6" y="66" width="4.3" height="8" rx="2" fill="#6e7681"/>
    <rect x="642.9" y="66" width="2.2" height="8" rx="2" fill="#30363d"/>

    <!-- Language Legend -->
    <circle cx="360" cy="92" r="3.5" fill="#f0f6fc"/>
    <text x="370" y="96" fill="#8b949e" font-size="9.5">Python:</text>
    <text x="475" y="96" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">88.6%</text>
    <circle cx="360" cy="118" r="3.5" fill="#c9d1d9"/>
    <text x="370" y="122" fill="#8b949e" font-size="9.5">JavaScript:</text>
    <text x="475" y="122" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">7.5%</text>
    <circle cx="360" cy="144" r="3.5" fill="#8b949e"/>
    <text x="370" y="148" fill="#8b949e" font-size="9.5">HTML:</text>
    <text x="475" y="148" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">1.7%</text>
    <circle cx="510" cy="92" r="3.5" fill="#6e7681"/>
    <text x="520" y="96" fill="#8b949e" font-size="9.5">TypeScript:</text>
    <text x="625" y="96" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">1.5%</text>
    <circle cx="510" cy="118" r="3.5" fill="#30363d"/>
    <text x="520" y="122" fill="#8b949e" font-size="9.5">C / Other:</text>
    <text x="625" y="122" fill="#f0f6fc" font-size="9.5" font-weight="600" text-anchor="end">0.8%</text>
  </g>

  <!-- Card 3: Streak Telemetry -->
  <g class="code-mono">
    <rect x="675" y="15" width="310" height="190" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <text x="690" y="42" fill="#f0f6fc" font-size="12" font-weight="700" letter-spacing="0.5">// STREAK VELOCITY</text>
    <line x1="690" y1="52" x2="970" y2="52" stroke="#21262d" stroke-width="1"/>
    
    <!-- Circular Flame Dial -->
    <g class="flame-icon">
      <circle cx="830" cy="115" r="38" fill="none" stroke="#30363d" stroke-width="2"/>
      <circle cx="830" cy="115" r="34" fill="none" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="830" y="112" fill="#f0f6fc" font-size="18" font-weight="800" text-anchor="middle">5</text>
      <text x="830" y="128" fill="#8b949e" font-size="7.5" font-weight="600" text-anchor="middle">DAYS MAX</text>
    </g>
    
    <text x="695" y="90" fill="#8b949e" font-size="8.5">TOTAL EVENTS</text>
    <text x="695" y="110" fill="#f0f6fc" font-size="14" font-weight="700">580</text>
    
    <text x="695" y="145" fill="#8b949e" font-size="8.5">CURRENT STREAK</text>
    <text x="695" y="165" fill="#f0f6fc" font-size="14" font-weight="700">2 DAYS</text>
    
    <text x="690" y="190" fill="#8b949e" font-size="8.5">// CONTINUOUS ACTIVE DEPLOYMENT</text>
  </g>
</svg>
