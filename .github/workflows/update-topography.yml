name: Update Contribution Telemetry Visualizers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

jobs:
  generate-telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install numpy pillow

      - name: Generate Visualizers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_map.py
          python scripts/generate_radar.py

      - name: Commit & Push updated Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/client_topology.svg assets/radial_radar.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update continuous rescanning radar & map" && git push)
